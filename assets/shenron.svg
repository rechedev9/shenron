<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Shenron</title>
  <desc id="desc">Four-node adversarial software delivery loop</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b16"/>
      <stop offset="1" stop-color="#123b2f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6ee7b7"/>
    </marker>
  </defs>
  <rect width="1200" height="360" rx="36" fill="url(#bg)"/>
  <g fill="none" stroke="#6ee7b7" stroke-width="8" opacity=".85" marker-end="url(#arrow)">
    <path d="M150 180 C150 80 320 52 410 116"/>
    <path d="M440 105 C560 30 720 35 820 115"/>
    <path d="M850 125 C980 150 980 265 850 280"/>
    <path d="M810 280 C680 335 500 330 410 270"/>
    <path d="M375 252 C255 315 145 270 150 200"/>
  </g>
  <g fill="#0b2a22" stroke="url(#accent)" stroke-width="7">
    <circle cx="150" cy="180" r="54"/>
    <circle cx="410" cy="116" r="54"/>
    <circle cx="850" cy="126" r="54"/>
    <circle cx="840" cy="280" r="54"/>
    <circle cx="390" cy="265" r="54"/>
  </g>
  <g fill="#ecfdf5" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">
    <text x="150" y="187" font-size="22">PLAN</text>
    <text x="410" y="123" font-size="22">BUILD</text>
    <text x="850" y="133" font-size="22">REVIEW A</text>
    <text x="840" y="287" font-size="22">REVIEW B</text>
    <text x="390" y="272" font-size="22">CORRECT</text>
  </g>
  <text x="1065" y="178" fill="url(#accent)" font-family="system-ui, sans-serif" font-size="66" font-weight="850" text-anchor="middle">SHENRON</text>
  <text x="1065" y="222" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">adversarial delivery loop</text>
</svg>
